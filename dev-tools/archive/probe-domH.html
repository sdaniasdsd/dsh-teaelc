<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DONE</title></head><body><pre id="out">led item=missing total=600
types=ResistorElm,SwitchElm,WireElm,CapacitorElm,InductorElm,VoltageElm,ResistorElm
ammeter item=missing
types2=ResistorElm,SwitchElm,WireElm,CapacitorElm,InductorElm,VoltageElm,ResistorElm</pre>
<script>
const out=document.getElementById('out'), L=[], log=s=>L.push(s);
const f=document.createElement('iframe'); f.src='./circuitjs.html?lang=zh';
f.style='position:absolute;left:-4000px;top:0;width:1200px;height:800px;border:0'; document.body.appendChild(f);
f.addEventListener('load',()=>{ setTimeout(()=>{
  const d=f.contentDocument, w=f.contentWindow;
  const cvs=[...d.querySelectorAll('canvas')].sort((a,b)=>b.width-a.width)[0];
  const rect=cvs.getBoundingClientRect();
  const M=(t,cx,cy)=>cvs.dispatchEvent(new MouseEvent(t,{bubbles:true,clientX:rect.left+cx,clientY:rect.top+cy,button:0}));
  const drag=(x,y)=>{ M('mousedown',x,y); cvs.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,clientX:rect.left+x+60,clientY:rect.top+y})); cvs.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,clientX:rect.left+x+60,clientY:rect.top+y})); };
  // 1) open Draw menu, click "Add LED"
  const drawItem=[...d.querySelectorAll('.gwt-MenuItem')].find(x=>x.textContent.trim().startsWith('绘制'));
  drawItem.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  setTimeout(()=>{
    const items=[...d.querySelectorAll('.menuItem')];
    const led=items.find(x=>x.textContent.trim()==='Add LED');
    log('led item='+(led?'found':'missing')+' total='+items.length);
    if(led) led.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    setTimeout(()=>{
      drag(300,300);
      setTimeout(()=>{
        log('types='+w.CircuitJS1.getElements().map(e=>e.getType()).join(','));
        // 2) ammeter via menu
        const drawItem2=[...d.querySelectorAll('.gwt-MenuItem')].find(x=>x.textContent.trim().startsWith('绘制'));
        if(drawItem2) drawItem2.dispatchEvent(new MouseEvent('click',{bubbles:true}));
        setTimeout(()=>{
          const items2=[...d.querySelectorAll('.menuItem')];
          const am=items2.find(x=>x.textContent.trim()==='Add Ammeter');
          log('ammeter item='+(am?'found':'missing'));
          if(am) am.dispatchEvent(new MouseEvent('click',{bubbles:true}));
          setTimeout(()=>{ drag(500,400);
            setTimeout(()=>{ log('types2='+w.CircuitJS1.getElements().map(e=>e.getType()).join(',')); out.textContent=L.join('\n'); document.title='DONE'; },600);
          },300);
        },300);
      },600);
    },300);
  },300);
}, 6000); });
</script><iframe src="./circuitjs.html?lang=zh" style="position: absolute; left: -4000px; top: 0px; width: 1200px; height: 800px; border: 0px;"></iframe>
</body></html>
