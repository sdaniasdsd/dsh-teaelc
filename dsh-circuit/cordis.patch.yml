# @commonworks/dsh-circuit — DSH bundle patch
#
# 把插件插入 profile 的配置树。安装方式见 INSTALL.md：
#   dsh plugin --profile web add @commonworks/dsh-circuit
#   或在 profile 的 dsh.profile.bundles 末尾追加 '@commonworks/dsh-circuit'
#
# 注意 `name:` 必须是**全限定包名**（含 scope）。宿主按这个名字 import 本包，
# scope 包若写成裸名（dsh-circuit）会解析失败，表现就是「装了不生效」。
#
# 本插件只注册 web 路由（/dsh-circuit/*），不注入 index.html，因此不需要在
# 启动期参与 DOM 装配；等服务就绪后挂载即可。
- insert:
    - id: dsh-circuit
      name: '@commonworks/dsh-circuit'
